<svg xmlns="http://www.w3.org/2000/svg" width="760" height="730" viewBox="0 0 760 730" role="img" aria-labelledby="title desc"><title id="title">UPLOAD / FROM FILE TO CHUNKS</title><desc id="desc">Stage &amp; validate, then Split into chunks, then Encrypt with AES-GCM, then Hash encrypted bytes, then Store objects + metadata.</desc><rect width="760" height="730" rx="12" fill="#e9ede3"/><g font-family="Arial,sans-serif" fill="#294332"><text x="36" y="46" font-size="14" letter-spacing="1.6">UPLOAD / FROM FILE TO CHUNKS</text><text x="36" y="78" font-size="17">Each uploaded file passes through the application server.</text><rect x="100" y="112" width="560" height="70" rx="8" fill="#fafbf6" stroke="#a8b79d"/><text x="128" y="156" font-size="15" fill="#637b59">01</text><text x="182" y="156" font-size="22">Stage &amp; validate</text><path d="M380 190v20m-6-6 6 6 6-6" fill="none" stroke="#55745c" stroke-width="2"/><rect x="100" y="216" width="560" height="70" rx="8" fill="#fafbf6" stroke="#a8b79d"/><text x="128" y="260" font-size="15" fill="#637b59">02</text><text x="182" y="260" font-size="22">Split into chunks</text><path d="M380 294v20m-6-6 6 6 6-6" fill="none" stroke="#55745c" stroke-width="2"/><rect x="100" y="320" width="560" height="70" rx="8" fill="#fafbf6" stroke="#a8b79d"/><text x="128" y="364" font-size="15" fill="#637b59">03</text><text x="182" y="364" font-size="22">Encrypt with AES-GCM</text><path d="M380 398v20m-6-6 6 6 6-6" fill="none" stroke="#55745c" stroke-width="2"/><rect x="100" y="424" width="560" height="70" rx="8" fill="#fafbf6" stroke="#a8b79d"/><text x="128" y="468" font-size="15" fill="#637b59">04</text><text x="182" y="468" font-size="22">Hash encrypted bytes</text><path d="M380 502v20m-6-6 6 6 6-6" fill="none" stroke="#55745c" stroke-width="2"/><rect x="100" y="528" width="560" height="70" rx="8" fill="#fafbf6" stroke="#a8b79d"/><text x="128" y="572" font-size="15" fill="#637b59">05</text><text x="182" y="572" font-size="22">Store objects + metadata</text><text x="36" y="684" font-size="14">Backblaze B2: encrypted chunks     /     PostgreSQL: reconstruction metadata</text></g></svg>
